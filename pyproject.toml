[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fp-amb"
version = "6.0.0"
description = "First-Person Agent Memory Benchmark: Framework-agnostic evaluation suite for long-term AI agent memory systems."
readme = "README.md"
authors = [
    { name = "FP-AMB Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0"
]
keywords = ["benchmark", "ai-agents", "llm-memory", "memory-evaluation", "rag", "long-context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/fp-amb/fp-amb-benchmark"
Repository = "https://github.com/fp-amb/fp-amb-benchmark.git"
Issues = "https://github.com/fp-amb/fp-amb-benchmark/issues"

[project.scripts]
fp-amb = "fp_amb.cli:main"
